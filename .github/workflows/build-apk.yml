name: Build APK

# Este workflow roda sempre que houver push na branch main
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Passo 1: Fazer checkout do repositório
    - name: Checkout repository
      uses: actions/checkout@v3

    # Passo 2: Configurar Java 11
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    # Passo 3: Instalar dependências e build APK
    - name: Build APK
      run: ./gradlew assembleDebug

    # Passo 4: Fazer upload do APK como artifact
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
